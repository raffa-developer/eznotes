name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve signing state
        id: signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            "state=signed" >> $env:GITHUB_OUTPUT
            Write-Host 'Windows code-signing credentials detected.'
          } else {
            "state=unsigned" >> $env:GITHUB_OUTPUT
            Write-Host '::warning::Windows signing secrets are not configured. Publishing an unsigned build.'
          }

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Smoke test install, launch, upgrade, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was produced.' }
          ./scripts/smoke-windows-install.ps1 -Installer $installer.FullName

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ezNotes-windows-${{ steps.signing.outputs.state }}-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build macOS packages
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: npm run dist:mac

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ezNotes-macos-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ezNotes-linux-${{ github.ref_name }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: ezNotes-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "ezNotes $tag" --generate-notes
          gh release upload "$tag" release-assets/* --clobber
