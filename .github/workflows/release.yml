name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve signing state
        id: signing
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            "state=signed" >> $env:GITHUB_OUTPUT
            Write-Host 'Windows code-signing credentials detected.'
          } else {
            "state=unsigned" >> $env:GITHUB_OUTPUT
            Write-Host '::warning::Windows signing secrets are not configured. Publishing an unsigned build.'
          }

      - name: Build installer
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Smoke test install, launch, upgrade, and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw 'No NSIS installer was produced.' }
          ./scripts/smoke-windows-install.ps1 -Installer $installer.FullName

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezNotes-${{ steps.signing.outputs.state }}-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_STATE: ${{ steps.signing.outputs.state }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = if ($env:SIGNING_STATE -eq 'signed') {
            'Windows build signed with the configured certificate.'
          } else {
            'Unsigned Windows build. Windows SmartScreen or Application Control may warn before launch.'
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "ezNotes $tag" --notes $notes
          }

          $assets = Get-ChildItem release |
            Where-Object {
              $_.Extension -in '.exe', '.blockmap' -or $_.Name -eq 'latest.yml'
            } |
            ForEach-Object { $_.FullName }
          if (-not $assets) { throw 'No release assets were produced.' }
          gh release upload $tag $assets --clobber
